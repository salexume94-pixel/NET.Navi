name: Benchmark scoring tests

on:
  push:
    paths:
      - "tools/benchmark/**"
      - "tests/test_smoke_test.py"
      - ".github/workflows/benchmark-tests.yml"
  pull_request:
    paths:
      - "tools/benchmark/**"
      - "tests/test_smoke_test.py"
      - ".github/workflows/benchmark-tests.yml"
  workflow_dispatch:

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify status scoring without running the model
        run: python -m unittest discover -s tests -p "test_*.py" -v
